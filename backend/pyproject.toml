[project]
name = "ai-dventure-backend"
version = "0.1.0"
description = "Claude-run multiplayer text adventure: FastAPI backend, MCP world tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic[mcp]>=0.116.0",
    "fastapi[standard]>=0.139.0",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
    "eval: LLM-as-judge test that calls the real API and costs tokens",
]
# Evals never run by accident — a plain `pytest` skips them even with an
# API key present. Run them deliberately: `pytest -m eval`.
addopts = "-m 'not eval'"
